[project]
name = "line-research-bot"
version = "0.1.0"
requires-python = ">=3.11,<3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "line-bot-sdk>=3.13",
    "google-cloud-firestore>=2.18",
    "google-cloud-storage>=2.18",
    "google-cloud-tasks>=2.16",
    "google-auth>=2.35",
    "httpx>=0.27",
    "pydantic-settings>=2.6",
    "tenacity>=9.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "pytest-snapshot>=0.9",
    "pytest-mock>=3.14",
    "respx>=0.21",
    "ruff>=0.7",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"
